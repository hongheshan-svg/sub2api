            }

  <body>
    <noscript>
      <h1>gw-link：Claude Code、Codex、Gemini CLI 的 AI API 中转网关</h1>
      <p>gw-link 是面向 Claude Code、Codex CLI、Gemini CLI、VS Code 插件等 AI 编程工具的 AI API 网关，同时兼容 Anthropic Messages（/v1/messages）、OpenAI Chat Completions / Responses（/v1/chat/completions、/v1/responses）与 Gemini 原生（/v1beta）接口。</p>
      <p>在控制台创建 API Key 后，把工具的 base_url 指向 gw-link 即可使用 Claude、GPT、Gemini 等模型，API Key、用量与计费在同一控制台统一管理。</p>
      <ul>
        <li>Claude Code：设置 ANTHROPIC_BASE_URL 与 ANTHROPIC_AUTH_TOKEN</li>
        <li>Codex CLI：在 ~/.codex/config.toml 中配置 base_url（/v1）与 wire_api = "responses"</li>
        <li>Gemini CLI：设置 GOOGLE_GEMINI_BASE_URL 与 GEMINI_API_KEY</li>
      </ul>
    </noscript>
